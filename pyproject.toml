[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
    "wheel",
    "setuptools_scm>=6.2",
]

[project]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "requests>=2.28.0",
    "typing-extensions>=4.5.0;python_version<'3.10'",
]
description = "Official API specification for Circular Protocol blockchain operations"
keywords = [
    "blockchain",
    "circular",
    "protocol",
    "smart-contracts",
    "web3",
    "sdk",
    "api",
    "python",
]
name = "circular-protocol-api"
readme = "README.md"
requires-python = ">=3.8"
version = "2.0.0-alpha.1"

[[project.authors]]
email = "dannydnc@protonmail.com"
name = "Danny De Novi"

[project.license]
text = "MIT"

[project.optional-dependencies]
async = ["aiohttp>=3.8.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "mypy>=1.0.0",
    "ruff>=0.0.270",
    "types-requests>=2.28.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
]

[project.urls]
Changelog = "https://github.com/circular-protocol/circular-protocol-py/blob/main/CHANGELOG.md"
Documentation = "https://docs.circular.org"
Homepage = "https://github.com/circular-protocol/circular-protocol-py"
Issues = "https://github.com/circular-protocol/circular-protocol-py/issues"
Repository = "https://github.com/circular-protocol/circular-protocol-py"

[tool.black]
include = '\.pyi?$'
line-length = 100
target-version = [
    "py38",
    "py39",
    "py310",
    "py311",
    "py312",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
python_version = "3.8"
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=circular_protocol_api",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "asyncio: Async tests",
]
python_classes = ["Test*"]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.ruff]
ignore = ["E501"]
line-length = 100
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
target-version = "py38"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
